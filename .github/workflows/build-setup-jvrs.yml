name: Build SETUP JVRS

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'Installer/**'
      - '.github/workflows/build-setup-jvrs.yml'

jobs:
  build-installer:
    runs-on: windows-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Preparar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Compilar aplicativo
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build, dist | Out-Null
          javac -encoding UTF-8 -d build src/JVRS.java
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          jar --create --file build/JVRS.jar --main-class JVRS -C build JVRS.class
          jpackage --type app-image --name "JOAO VITOR - MULTIMÍDIA JVRS" --input build --main-jar JVRS.jar --main-class JVRS --dest dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Instalar Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Compilar SETUP JVRS
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "Installer/SETUP_JVRS.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publicar instalador como artefato
        uses: actions/upload-artifact@v4
        with:
          name: SETUP_JVRS
          path: output/SETUP_JVRS.exe
          if-no-files-found: error
